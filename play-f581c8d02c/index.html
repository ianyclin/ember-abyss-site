<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}html,body{margin:0;background:#0c0a09}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<title>燼燈深淵</title>

<style>
/* Layout: one-screen app. HUD strip on top, lantern-lit dungeon canvas in the middle, thumb controls at the bottom. Single committed dark look (a lamp in a cellar). */
:root{
  --void:#0c0a09;      /* unlit stone */
  --stone:#17130f;     /* panels */
  --ash:#3a2f27;       /* borders */
  --bone:#efe3cc;      /* text */
  --dim:#9a8b77;       /* secondary text */
  --ember:#ff9a3c;     /* accent: lamp flame */
  --blood:#e0584a;     /* life / danger */
  --oil:#e9b949;       /* lamp oil */
  --jade:#6cc2a6;      /* good effects */
  --violet:#b294e6;    /* magic */
  --f-display:"LXGW WenKai TC","Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--f-body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;max-width:1100px;margin:0 auto}

/* HUD */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.bar{position:relative;height:22px;border:1px solid var(--ash);border-radius:3px;background:#0f0c0a;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:50%;transition:width .25s ease}
.bar.hp i{background:linear-gradient(90deg,#7d211b,var(--blood))}
.bar.oil i{background:linear-gradient(90deg,#7a5a17,var(--oil))}
.bar span{position:relative;display:block;padding:0 8px;line-height:20px;font-size:12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 1px 2px #000;white-space:nowrap}
.bar span b{font-family:var(--f-body);font-weight:700;margin-right:6px}
.chips{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--dim);white-space:nowrap}
.chips strong{color:var(--bone);font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.chips .lv{display:inline-flex;align-items:baseline;gap:4px}
.xp{display:inline-block;width:38px;height:3px;background:var(--ash);vertical-align:middle;position:relative;top:-2px}
.xp i{display:block;height:100%;background:var(--violet)}
.status{position:absolute;top:8px;left:8px;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;max-height:calc(100% - 16px);overflow:hidden}   /* 狀態疊在地圖框左上角、上下排列，不佔版面 */
.status .st{background:rgba(10,8,7,.72)}
.stage.boss .status{top:50px}   /* 頭目血條在左上角時往下讓 */
.st{font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid currentColor;letter-spacing:.06em;font-family:var(--f-body)}

/* Stage */
.stage{position:relative;flex:1;min-height:0;border:1px solid var(--ash);border-radius:4px;overflow:hidden;background:var(--void)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.log.quiet p:not(:last-child){display:none}.log.quiet p:last-child{opacity:.5!important}
.log{position:absolute;left:10px;right:10px;bottom:8px;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.45;pointer-events:auto;cursor:pointer}
.log p{margin:0;text-shadow:0 1px 3px #000,0 0 8px #000;max-width:46em}
.banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease}
.banner.on{opacity:1}
.banner .n{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,9vw,72px);color:var(--ember);text-shadow:0 0 24px rgba(255,120,40,.55);line-height:1.1}
.banner .s{font-size:13px;letter-spacing:.4em;color:var(--dim);margin-top:6px}
.topbtn{position:absolute;top:8px;right:8px;display:flex;gap:6px}

/* Controls */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .btn{white-space:nowrap}
.btn{appearance:none;border:1px solid var(--ash);background:var(--stone);border-radius:4px;padding:10px 12px;font-size:15px;font-weight:700;letter-spacing:.12em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:#5a4838}
.btn:active{transform:translateY(1px);background:#211a15}
.btn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn.atk{border-color:var(--ember);color:var(--ember);box-shadow:0 0 12px rgba(255,154,60,.22)}
.btn.hot{border-color:var(--ember);color:var(--ember);box-shadow:0 0 0 1px rgba(255,154,60,.25) inset,0 0 14px rgba(255,154,60,.18)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px;letter-spacing:.08em;background:rgba(23,19,15,.85)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:10px;color:var(--dim);border:1px solid var(--ash);border-radius:2px;padding:0 4px;font-weight:500;letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px}
.pad button{appearance:none;border:1px solid var(--ash);background:var(--stone);border-radius:6px;font-size:20px;color:var(--bone);cursor:pointer;touch-action:none}
.pad button:active,.pad button.down{background:#2a2019;border-color:var(--ember);color:var(--ember)}
.pad .c{font-size:13px;color:var(--dim);letter-spacing:.1em}
.btn.ready{border-color:var(--violet);color:var(--violet);box-shadow:0 0 12px rgba(178,148,230,.18)}
.btn.cool{color:var(--dim)}
.hoodb{display:none;grid-column:1/-1}
.galrow{margin:14px 0 4px}.galrow>b{display:block;margin-bottom:6px;font-size:15px}.galtiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.galtiles.all{grid-template-columns:1fr}.galtiles.seas{grid-template-columns:repeat(4,1fr)}.galt.ts{aspect-ratio:9/16}.galt.ts span small{font-size:11px;color:var(--dim)}.galt.tall{aspect-ratio:16/9}.galt{appearance:none;padding:0;border:1px solid var(--ash);border-radius:4px;background:#0f0b09;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}.galt{aspect-ratio:3/4}.galt.t1 img,.galt.t3 img{object-position:50% 30%}.galt img{width:100%;height:100%;object-fit:cover;display:block}.galt.lock{cursor:default}.galt{position:relative}.galt .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.36) blur(5px) saturate(.5);transform:scale(1.12)}.galt.lock span{position:relative;z-index:1;text-shadow:0 1px 3px #000}html[lang^=zh] .galt.lock span{white-space:nowrap;padding:4px 0;letter-spacing:0}html[lang=ja] .galt.lock span{padding:4px 2px;letter-spacing:0;line-height:1.35}@media (max-width:370px){.galt.lock span{font-size:9.5px!important}}html[lang=en] .galt.lock span{font-size:10px;padding:4px 3px;line-height:1.35}.galt.gpaid{cursor:pointer;opacity:.75}.galt.gpaid .fbadge{margin:0;white-space:nowrap;font-size:9px;padding:1px 3px;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}html[lang=en] .galt.gpaid .fbadge{font-size:8px;padding:1px 2px;letter-spacing:-.02em}.galt.lock span{font-size:11px;color:var(--dim);padding:6px;text-align:center;line-height:1.5}.galview img{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:4px}a.btn{text-decoration:none;color:var(--bone)}
.choice.paid{cursor:pointer}.fbadge{margin-left:8px;font-size:11px;font-weight:700;letter-spacing:.08em;padding:1px 8px;border:1px solid var(--ember);border-radius:999px;color:var(--ember);vertical-align:3px}.fthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px}@media (min-width:600px){.fthumbs{grid-template-columns:repeat(6,1fr)}.fthumbs figcaption{font-size:11px;letter-spacing:.04em}}.fthumbs figure{position:relative;margin:0;aspect-ratio:1;border:1px solid var(--ash);border-radius:4px;overflow:hidden;background:#0f0b09}.fthumbs img{width:100%;height:100%;object-fit:cover;display:block}.fthumbs figcaption{position:absolute;left:0;right:0;bottom:0;padding:10px 6px 4px;font-size:12px;letter-spacing:.1em;text-align:center;color:var(--bone);background:linear-gradient(to bottom,transparent,rgba(0,0,0,.75))}
.bkbox{width:100%;box-sizing:border-box;margin:0 0 8px;padding:8px 10px;border:1px solid var(--ash);border-radius:4px;background:#0f0c0a;color:var(--bone);font:12px/1.5 var(--f-mono);word-break:break-all;resize:vertical;-webkit-user-select:text;user-select:text}
.fulll{margin:8px 0 0 1.2em;padding:0;line-height:1.9;color:var(--dim)}
#bHood{display:none}
.pad button.shoot{border-color:var(--ember);color:var(--ember);background:rgba(255,154,60,.12)}
.pad .c.hot{border-color:var(--ember);color:var(--ember);background:rgba(255,154,60,.12)}
.stickz{display:none;position:relative;align-self:stretch;min-width:150px;min-height:150px;border:1px dashed var(--ash);border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.stickz .shint{position:absolute;inset:auto 0 8px 0;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.08em;pointer-events:none}
.stickz .ring{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px solid var(--ash);background:rgba(20,15,12,.55);display:none;pointer-events:none}
.stickz .ring i{position:absolute;inset:0;border-radius:50%}
.stickz .ring b{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--stone);border:2px solid var(--ember);box-shadow:0 0 12px rgba(255,154,60,.35)}
.stickz.on .ring{display:block}.stickz.on .shint{display:none}
body.stick .pad{display:none}body.stick .stickz{display:block}body.stick .hoodb{display:flex}
.quick{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qs{white-space:nowrap;overflow:hidden}
.qs{appearance:none;border:1px dashed var(--ash);background:transparent;border-radius:4px;min-height:40px;padding:4px 8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--dim);cursor:pointer}
.qs.set{border-style:solid;background:var(--stone);color:var(--bone)}
.qs.empty0{opacity:.45}
.qs b{font-weight:900;font-size:18px}
.qs:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
@media (hover:none),(pointer:coarse){.topbtn kbd,.qs kbd{display:none}}
.qs .qe{margin-left:6px;font-size:12px;opacity:.7}.qcell .qn{font-size:11px;color:var(--dim);white-space:nowrap}
.topbtn kbd{margin-left:4px}
html[lang=en] .btn,html[lang=en] .tab,html[lang=en] .tog,html[lang=en] .choice b{letter-spacing:.02em}
html[lang=en] .sheet h3{letter-spacing:.12em}
html[lang=en] .title .en{display:none}
html[lang=en] .title h1{font-size:clamp(40px,10.5vw,76px);letter-spacing:.01em}
.hint{display:none;font-size:12px;color:var(--dim);line-height:1.6}

/* 手機、平板：三欄。左：探索、行囊｜中：方向鍵或圓形搖桿｜右：搜索、技能。四顆按鈕的高度拉齊中間 */
@media (hover:none),(pointer:coarse){
  
  .ctl,body.stick .ctl{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"q q q" "l1 mid r1" "l2 mid r2";align-items:stretch;gap:8px}
  .quick{grid-area:q;display:flex;justify-content:space-between}   /* 快捷1 靠左、快捷2 靠右，搖桿正上方留空 */
  #quick .qs{width:36%;max-width:150px;min-height:44px;padding:4px 6px;font-size:13px;gap:4px;text-overflow:ellipsis}#quick .qs b{font-size:16px}
  .acts{display:contents}
  #bAct{grid-area:l1;justify-self:start}#bSkill{grid-area:l2;justify-self:start}#bExplore{grid-area:r1;justify-self:end}#bInv{grid-area:r2;justify-self:end}
  body.lefty #bExplore{grid-area:l1;justify-self:start}body.lefty #bInv{grid-area:l2;justify-self:start}body.lefty #bAct{grid-area:r1;justify-self:end}body.lefty #bSkill{grid-area:r2;justify-self:end}   /* 預設：搜索、特技在左；左撇子：搜索、特技在右 */
  .acts .btn{width:min(74px,100%);height:min(68px,100%);align-self:center;min-height:0;min-width:0;padding:6px 3px;font-size:16px;letter-spacing:.06em;white-space:normal;text-align:center;line-height:1.25;overflow-wrap:anywhere;overflow:hidden}
  html[lang=en] .acts .btn{font-size:12px;letter-spacing:0;overflow-wrap:normal;hyphens:auto;-webkit-hyphens:auto}
  @media (max-width:380px){html[lang=en] .acts .btn{font-size:11px}}
  .acts kbd,.hoodb,body.stick .hoodb{display:none}
  .pad,.stickz{grid-area:mid}
  .pad{grid-template-columns:repeat(3,var(--padc));grid-template-rows:repeat(3,var(--padc))}
  .stickz,body.stick .stickz{width:calc(var(--padc)*3 + 10px);height:calc(var(--padc)*3 + 10px);min-width:0;min-height:0;border:0;align-self:center}
}
/* 圓形搖桿：固定顯示；從圓心往外拖就走，八個方向；輕點圓心＝遮燈 */
.stickz .ring{display:block;box-sizing:border-box;left:50%;top:50%;width:100%;height:100%;margin:0;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(36,28,22,.9) 0 52%,rgba(20,15,12,.85) 53%)}
:root{--padc:52px}
@media (max-width:380px){:root{--padc:46px}}
.stickz .ring .tk{position:absolute;inset:auto;left:50%;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid var(--ash);margin:-4px 0 0 -6px;border-radius:0}
.stickz .ring .tk:nth-child(1){transform:rotate(0deg) translateY(calc(var(--padc,52px) * -1.32))}.stickz .ring .tk:nth-child(2){transform:rotate(45deg) translateY(calc(var(--padc,52px) * -1.32))}
.stickz .ring .tk:nth-child(3){transform:rotate(90deg) translateY(calc(var(--padc,52px) * -1.32))}.stickz .ring .tk:nth-child(4){transform:rotate(135deg) translateY(calc(var(--padc,52px) * -1.32))}
.stickz .ring .tk:nth-child(5){transform:rotate(180deg) translateY(calc(var(--padc,52px) * -1.32))}.stickz .ring .tk:nth-child(6){transform:rotate(225deg) translateY(calc(var(--padc,52px) * -1.32))}
.stickz .ring .tk:nth-child(7){transform:rotate(270deg) translateY(calc(var(--padc,52px) * -1.32))}.stickz .ring .tk:nth-child(8){transform:rotate(315deg) translateY(calc(var(--padc,52px) * -1.32))}
.stickz .ring .tk.on{border-bottom-color:var(--ember)}
.stickz .ring b{width:60px;height:60px;margin:-30px 0 0 -30px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);letter-spacing:0;white-space:nowrap;transition:transform .06s}
html[lang=ja] .stickz .ring b,html[lang=en] .stickz .ring b{font-size:10px}
.stickz .ring b.hot{color:var(--ember)}
.stickz.on .ring b{border-color:var(--ember)}
@media (hover:hover) and (pointer:fine){
  .pad{display:none}
  .ctl{grid-template-columns:auto minmax(0,1fr)}
  .acts{grid-template-columns:repeat(5,auto)}
  .hoodb,body.stick .hoodb{display:flex;grid-column:auto}.stickz,body.stick .stickz{display:none}
  .quick{grid-template-columns:repeat(2,minmax(0,220px))}
  .hint{display:block;text-align:right}
}
@media (max-width:760px){ .hint{display:none!important} }
@media (hover:hover) and (pointer:fine) and (max-width:760px){ .ctl{grid-template-columns:minmax(0,1fr)} .acts{grid-template-columns:repeat(5,minmax(0,1fr))} .acts .btn{padding:6px 4px;letter-spacing:.04em;white-space:normal;line-height:1.2;text-align:center;min-width:0} html[lang=en] .acts .btn{font-size:13px;letter-spacing:0;hyphens:auto;-webkit-hyphens:auto} }
@media (hover:hover) and (pointer:fine) and (max-width:440px){ .acts .btn kbd{display:none} }
@media (max-width:380px){ .pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)} .btn{font-size:14px;letter-spacing:.06em;padding:8px} }
@media (max-width:560px){ .hud{grid-template-columns:1fr} .chips{justify-content:space-between} }

/* Modal */
.modal{position:fixed;inset:0;background:rgba(6,5,4,.78);display:flex;align-items:center;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));backdrop-filter:blur(2px)}
.sheet .stickyb{position:sticky;bottom:-22px;margin:14px -20px -22px!important;padding:12px 20px 16px;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--stone) 30%);z-index:2}
/* 標題畫面背景：出發前夜的井口廣場（art/events/title.jpg），選單面板半透明 */
#tbg{display:none;position:fixed;inset:0;z-index:19;background:#0c0a09 center 62%/cover no-repeat}body.ontitle #tbg{display:block}
body.ontitle .modal{background:rgba(6,5,4,.28)}body.ontitle .sheet{background:rgba(23,19,15,.84);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media (max-width:760px){body.ontitle #tbg{bottom:auto;height:32%;background-position:52% 78%;background-size:cover}body.ontitle #tbg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,#0c0a09)}body.ontitle{background:#0c0a09}body.ontitle .modal{align-items:flex-end;background:transparent}body.ontitle .sheet{max-height:76%;background:rgba(23,19,15,.8)}body.ontitle .sheet h1{font-size:clamp(40px,12vw,56px)}}   /* 手機：上方約三成露出井口廣場（亮著的井口），選單靠下 */
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--stone);border:1px solid var(--ash);border-radius:6px;padding:22px 20px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:38px;margin:0 0 4px;color:var(--ember);line-height:1.1;text-wrap:balance}
.sheet h3{font-size:13px;letter-spacing:.3em;color:var(--dim);margin:18px 0 8px;font-weight:700}
.sheet p{line-height:1.75;margin:0 0 10px;color:var(--bone);max-width:36em}
.sheet .muted{color:var(--dim);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}

function makeMon(k,x,y,d){const M=MON[k],ov=Math.max(0,d-M.d),D=dif();

// 依樓層挑裝備階級：本層主力階級 55、下一階預告（剛好下一層開始常見）15、上一階 20、更舊的合計 10；起始裝備權重壓低
function genGear(cat,d){const TB=cat==='weapon'?WEAP:ARMR;let h=0;TB.forEach((t,i)=>{if(t.d<=d)h=i});
 const w=TB.map((t,i)=>i===h?55:i===h+1&&t.d===d+1?15:i===h-1?(t.d===0?8:20):i<h-1?(t.d===0?2:10/Math.max(1,h-1)):0);
 let r=rnd()*w.reduce((a,b)=>a+b,0),t=TB[h];for(let i=0;i<TB.length;i++){r-=w[i];if(r<0){t=TB[i];break}}
 const e=chance(.12+d*.03)?ri(1,Math.max(1,d>>2)):0;return{cat,id:t.id,n:t.n,v:t.a,e}}
// 負面效果的藥水與符紙：地上會撿到，但商人不賣

function genItem(d,shop){if(shop){let it;do it=genItem0(d,true);while((it.cat==='potion'||it.cat==='scroll')&&BAD_K[it.k]);return it}return genItem0(d,false)}
function genItem0(d,shop){const r=rnd()*100;
 if(r<37)return{cat:'potion',k:wpick(POTW),n:1};

 return{cat:'oil',n:1}}

// 藥水、符紙依效果定價（倍率）；鍛刃符／固甲符效果等同一次鍛造，定為一般符紙的 2.2 倍
const ITEM_MUL={heal:1.3,str:1,haste:1,sight:.8,ember:1.1,insight:3,confuse:.6,poison:.6,teleport:1,mapping:.9,blaze:1.1,fear:1,identify:.7,summon:.6,douse:.6};
function basePrice(it,d){if(it.cat==='potion'||it.cat==='scroll'){const b=(it.cat==='potion'?22:26)+d*4;
  if(it.k==='enchw'||it.k==='encha')return Math.round(b*2.2);   // 效果等同一次鍛造：依樓層固定高價（不看身上的裝備）
  return Math.round(b*(ITEM_MUL[it.k]||1))}if(it.cat==='weapon'||it.cat==='armor')return 25+it.v*22+forgeSum(it.v,it.e||0);if(it.cat==='gem')return Math.round((55+d*4)*(gG(it.k)>=2?2.5:1));return 20}

/* ================= 視野與尋路 ================= */
function fov(){
 vis.fill(0);const r=lightR();
 // 看得見 = 那一格有光，而且在你的視線內（12 格內、沒被牆擋住）
 const sight=new Uint8Array(W*H);
 const mark=(x,y)=>{const i=idx(x,y);vis[i]=1;G.seen[i]=1};
 const markIfSeen=(x,y)=>{if(sight[idx(x,y)])mark(x,y)};
 const ray=(ox,oy,r,put)=>{const px=ox+.5,py=oy+.5,r2=(r+.5)*(r+.5);put(ox,oy);const N=Math.max(160,r*56);
  for(let a=0;a<N;a++){const ang=a/N*Math.PI*2,dx=Math.cos(ang)*.33,dy=Math.sin(ang)*.33;let x=px,y=py;
   for(let s=0;s<70;s++){x+=dx;y+=dy;const tx=Math.floor(x),ty=Math.floor(y);if(!inb(tx,ty))break;if((x-px)*(x-px)+(y-py)*(y-py)>r2)break;put(tx,ty);if(opaque(tx,ty)&&!(tx===ox&&ty===oy))break}}};
 ray(P.x,P.y,12,(x,y)=>{sight[idx(x,y)]=1});
 const cast=(ox,oy,rr)=>ray(ox,oy,rr,markIfSeen);
 ray(P.x,P.y,r,mark);
 // 補漏：射線會在牆角擦過時漏掉門口斜角的格子；兩個方向任一條直線沒被擋住就算看得見（較寬鬆、玩家直覺的視野）
 for(let y=P.y-r;y<=P.y+r;y++)for(let x=P.x-r;x<=P.x+r;x++){if(!inb(x,y)||vis[idx(x,y)])continue;const dx=x-P.x,dy=y-P.y;if(dx*dx+dy*dy>(r+.5)*(r+.5))continue;
  if(los(P.x,P.y,x,y)||los(x,y,P.x,P.y)){mark(x,y);sight[idx(x,y)]=1}}
 // 點亮的燭台會一直照亮四周 3 格：之後走回這一區不必靠自己的燈
 for(const f of G.feats)if(f.kind==='brazier'&&f.lit)cast(f.x,f.y,3);
 for(const g of (G.glow||[]))if(cheb(g.x,g.y,P.x,P.y)<=14)cast(g.x,g.y,2);
 for(const it of G.items)if(vis[idx(it.x,it.y)])it.seen=1;
 calcLights();discScan();
}
// 燭台、螢苔的光：只照得到它「看得見」的格子。牆只有朝向光源那一面會亮（光在牆後面時，牆的這一面是暗的）
const LT=new Float32Array(W*H);
function calcLights(){LT.fill(0);const src=[];
 for(const f of G.feats)if(f.kind==='brazier'&&f.lit)src.push([f.x,f.y,.75,4.3]);
 for(const g of (G.glow||[]))src.push([g.x,g.y,.5,3.2]);
 for(const[sx,sy,k,R]of src){const rr=Math.ceil(R);
  for(let y=sy-rr;y<=sy+rr;y++)for(let x=sx-rr;x<=sx+rr;x++){if(!inb(x,y))continue;const i=idx(x,y);if(!vis[i])continue;
   const v=k*clamp(1-Math.hypot(x-sx,y-sy)/R,0,1);if(v<=LT[i])continue;
   let ok=false;
   if(x===sx&&y===sy)ok=true;
   else if(opaque(x,y)){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!inb(nx,ny)||opaque(nx,ny)||!vis[idx(nx,ny)])continue;if((nx===sx&&ny===sy)||los(sx,sy,nx,ny)||los(nx,ny,sx,sy)){ok=true;break}}}
   else ok=los(sx,sy,x,y)||los(x,y,sx,sy);
   if(ok)LT[i]=v}}}
function los(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy,x=x0,y=y0;
 for(let n=0;n<100;n++){if(x===x1&&y===y1)return true;if(!(x===x0&&y===y0)&&opaque(x,y))return false;const e2=2*e;if(e2>=dy){e+=dy;x+=sx}if(e2<=dx){e+=dx;y+=sy}}return false}
function lineCells(x0,y0,x1,y1){const out=[];let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy,x=x0,y=y0;
 for(let n=0;n<60;n++){if(!(x===x0&&y===y0)){if(!passable(x,y))break;out.push([x,y])}if(x===x1&&y===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x+=sx}if(e2<=dx){e+=dx;y+=sy}}return out}
function computeDist(){dist.fill(-1);const s=idx(P.x,P.y),q=[s];dist[s]=0;let h=0;
 while(h<q.length){const c=q[h++],cx=c%W,cy=(c/W)|0;for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const n=idx(nx,ny);if(dist[n]!==-1||!passable(nx,ny)||featAt(nx,ny))continue;dist[n]=dist[c]+1;q.push(n)}}}
function bfsPath(goal,avoidTraps=true){
 const prev=new Int32Array(W*H).fill(-1),s=idx(P.x,P.y),q=[s];prev[s]=s;let h=0;
 while(h<q.length){const c=q[h++],cx=c%W,cy=(c/W)|0;
  if(c!==s&&goal(cx,cy)){const path=[];let k=c;while(k!==s){path.unshift([k%W,(k/W)|0]);k=prev[k]}return path}
  for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const n=idx(nx,ny);if(prev[n]!==-1)continue;
   if(!G.seen[n]||!passable(nx,ny))continue;if(featAt(nx,ny)&&!goal(nx,ny))continue;
   if(avoidTraps){const t=trapAt(nx,ny);if(t&&t.found&&!goal(nx,ny))continue}
   prev[n]=c;q.push(n)}}
 return null}
const inCandle=m=>G.feats.some(f=>f.kind==='brazier'&&f.lit&&cheb(f.x,f.y,m.x,m.y)<=3)||(G.glow||[]).some(g=>cheb(g.x,g.y,m.x,m.y)<=2);
function monVisible(m){if(!vis[idx(m.x,m.y)])return P.st.sight>0;if(MON[m.k].shade&&cheb(m.x,m.y,P.x,P.y)>2&&!inCandle(m))return P.st.sight>0;return true}

  msg(tr("t0265",M.n,dmg,note),tone);
  hurtMon(m,dmg,true);
  const gl=gemN('w','life');if(gl)healPlayer(gl);
  if(rel('tooth')&&m.hp>0&&chance(.2)){m.st.burn=3;m.st.burnP=1}
  const gf=gemN('w','fire');if(gf&&m.hp>0&&chance(1-Math.pow(.75,gf))){m.st.burn=3;m.st.burnP=1;fxBurst(m.x,m.y,'#ff6a4a',6,2)}}}
function monStrike(m,base,label){const M=MON[m.k];
 if(chance(dodgeOf())){msg(tr("t0266",M.n),'jade');fxText(P.x,P.y,L["g_閃"],'#9ad0ff');sfx('miss');return false}
 if(M.phase&&(P.hood||P.oil<=0))base*=2;
 const dmg=Math.max(1,roll(base)-ri(Math.floor(defOf()/2),defOf()));
 msg(tr("t0267",M.n,label,dmg),'blood');hurtPlayer(dmg,tr("t0268",M.n),'mon:'+m.k);return true}
function monMelee(m){const M=MON[m.k];bump(m,Math.sign(P.x-m.x),Math.sign(P.y-m.y));
 if(monStrike(m,m.atk,L["t0269"])){
  if(perk('thorns')&&m.hp>0){hurtMon(m,2*perk('thorns'),true)}
  if(M.web&&!G.over&&chance(.3)){P.st.slow=3;msg(L["t0270"],'violet')}

function stepToward(m,away){const cur=dist[idx(m.x,m.y)];let best=[],bv=away?cur:(cur<0?999:cur);
 for(const[dx,dy]of DIRS){const nx=m.x+dx,ny=m.y+dy;if(!inb(nx,ny)||occupied(nx,ny))continue;const v=dist[idx(nx,ny)];if(v<0)continue;
  if(away?v>bv:v<bv){bv=v;best=[[nx,ny]]}else if(v===bv&&best.length)best.push([nx,ny])}
 if(best.length&&(away?bv>cur:bv<(cur<0?999:cur))){const[nx,ny]=pick(best);m.x=nx;m.y=ny;return true}
 if(cur<0&&!away){const dx=Math.sign(P.x-m.x),dy=Math.sign(P.y-m.y);if(!occupied(m.x+dx,m.y+dy)){m.x+=dx;m.y+=dy;return true}}
 return false}
function phaseStep(m){const dx=Math.sign(P.x-m.x),dy=Math.sign(P.y-m.y);for(const[ax,ay]of[[dx,dy],[dx,0],[0,dy]]){const nx=m.x+ax,ny=m.y+ay;if((ax||ay)&&inb(nx,ny)&&!monAt(nx,ny)&&!(nx===P.x&&ny===P.y)&&!featAt(nx,ny)){m.x=nx;m.y=ny;return}}}
function wander(m){const[dx,dy]=pick(DIRS);if(!occupied(m.x+dx,m.y+dy)){m.x+=dx;m.y+=dy}}
function act(m){
 const M=MON[m.k],d=cheb(m.x,m.y,P.x,P.y);
 if(m.k==='bomb'&&m.st.burn>0){msg(L["t0272"],'ember');explode(m.x,m.y,8+G.depth,L["t0251"]);m.hp=0;return}
 if(m.st.burn>0){m.st.burn--;hurtMon(m,2,!!m.st.burnP);if(!m.st.burn)m.st.burnP=0;if(m.hp<=0)return}
 if(m.st.stun>0){m.st.stun--;return}
 if(m.asleep&&m.deep){if(G.tutReady&&d<=2&&!P.hood&&P.oil>0){   /* 看過提示之後才會被燈照醒：轉角突然撞見時不會來不及讀 */m.asleep=false;m.aware=true;m.deep=false;msg(L.ui_tut_woke,'oil')}return}
 if(m.asleep){const lit=vis[idx(m.x,m.y)];if((d<=2&&chance(.4))||(lit&&chance(.15))){m.asleep=false;m.aware=true;if(lit)msg(tr("t0273",M.n),'dim')}return}
 if(M.ai==='moth'){if(P.hood||P.oil<=0){m.aware=false;if(chance(.5))wander(m);return}if(d<=lightR()+6)m.aware=true}
 if(!m.aware){if(d<=(P.hood?(rel('shell')?1:2):G.omen==='fog'?6:9)&&los(m.x,m.y,P.x,P.y)){m.aware=true;if(m.k==='wolf')howl(m)}else{if(chance(.3))wander(m);return}}
 if(P.hood&&d>4&&!M.big&&M.ai!=='moth'&&chance(.25)){m.aware=false;wander(m);return}
 if(dist[idx(m.x,m.y)]>24&&!M.phase&&!M.big){m.aware=false;return}
 if(P.st.stealth>0&&!M.boss){m.aware=false;if(chance(.3))wander(m);return}
 if(m.st.fear>0){m.st.fear--;if(!stepToward(m,true)&&d===1)monMelee(m);return}
 const see=los(m.x,m.y,P.x,P.y);
 switch(M.ai){
  case 'erratic':if(!P.hood&&lightR()>=5&&d<=3&&d>1&&stepToward(m,true))return;
   if(chance(.45)){wander(m);return}
   if(d===1)monMelee(m);else stepToward(m);return;
  case 'ranged':
   // 射一箭後要裝填一回合（地圖上顯示「填」）：裝填時只會後退或近戰
   if(m.rl>0){m.rl=0;if(d<=2&&chance(.6)&&stepToward(m,true))return;if(d===1)monMelee(m);return}
   if(d>1&&d<=M.range&&see){bump(m,Math.sign(P.x-m.x),Math.sign(P.y-m.y));fxBolt(m.x,m.y,P.x,P.y,'#e8d9a0');monStrike(m,m.atk,L["t0274"]);m.rl=1;return}
   if(d<=2&&chance(.6)&&stepToward(m,true))return;
   if(d===1)monMelee(m);else stepToward(m);return;
  case 'caster':
   m.cd=(m.cd||0)-1;
   if(d===1&&chance(.5)){blinkMon(m);return}
   if(d<=M.range&&see&&m.cd<=0){m.cd=3;fxBolt(m.x,m.y,P.x,P.y,'#ff7a3c');sfx('fire');if(monStrike(m,m.atk+2,L["t0275"])&&chance(.35)){P.st.burn=3;msg(L["t0276"],'ember')}return}
   if(d===1)monMelee(m);else if(d>3||!see)stepToward(m);else if(chance(.5))stepToward(m,true);return;
  case 'bomber':
   if(m.fuse){if(d<=1)explode(m.x,m.y,8+G.depth,L["t0251"]);else explode(m.x,m.y,8+G.depth,L["t0251"]);m.hp=0;return}
   if(d===1){m.fuse=1;msg(L["t0277"],'ember');fxBurst(m.x,m.y,'#ff9a3c',8,1);return}
   stepToward(m);return;
  case 'moth':if(d===1){bump(m,Math.sign(P.x-m.x),Math.sign(P.y-m.y));if(monStrike(m,m.atk,L["t0278"])&&P.oil>0){burnOil(4);msg(L["t0279"],'oil')}}else stepToward(m);return;
  case 'boss':return bossAct(m,d,see);
  case 'mid':return midAct(m,d,see);
  case 'warden':return wardenAct(m,d,see);
  default:
   if(d===1){monMelee(m);return}
   if(m.k==='golem'&&vis[idx(m.x,m.y)])return;
   if(M.phase)phaseStep(m);else stepToward(m);
 }}
function howl(m){let n=0;for(const o of G.mons)if(o!==m&&o.k==='wolf'&&o.hp>0&&cheb(o.x,o.y,m.x,m.y)<=10&&!o.aware){o.aware=true;o.asleep=false;n++}
 if(n||vis[idx(m.x,m.y)])msg(n?tr("t0280",n):L["t0281"],'blood')}
function blinkMon(m){for(let t=0;t<40;t++){const x=m.x+ri(-6,6),y=m.y+ri(-6,6);if(inb(x,y)&&!occupied(x,y)&&cheb(x,y,P.x,P.y)>=3&&dist[idx(x,y)]>=0){fxBurst(m.x,m.y,'#de78bd',10,2);m.x=x;m.y=y;m.vx=x;m.vy=y;if(vis[idx(x,y)])msg(L["t0282"],'violet');return}}}
/* ================= 頭目：預警格 =================
   放招時先在地上標出格子（看得到、躲得掉），玩家下一次行動之後才爆發 */
// 預警：delay 回合後落下（吞光者的暗潮、燼王的爆炎與流星都是 2 回合，走兩步就躲得開）
function telegraph(m,cells,dmg,kind,lbl,delay=1){G.warn=G.warn||[];for(const[x,y]of cells)if(inb(x,y)&&tile(x,y)!==T.WALL&&!G.warn.some(w=>w.x===x&&w.y===y))G.warn.push({x,y,at:G.turn+delay,dmg,kind,lbl,src:m.k})}
const hasWarn=m=>(G.warn||[]).some(w=>w.src===m.k);
function detonateWarns(){if(!G.warn||!G.warn.length)return;const now=G.warn.filter(w=>w.at<=G.turn);if(!now.length)return;G.warn=G.warn.filter(w=>w.at>G.turn);let hit=null;
 for(const w of now){if(w.kind==='charge')continue;fxBurst(w.x,w.y,w.kind==='fire'?'#ff6a2a':'#8f7dff',6,2.5);if(w.kind==='fire')ignite(w.x,w.y);
  const o=monAt(w.x,w.y);if(o&&!MON[o.k].big)hurtMon(o,Math.round(w.dmg*.6),false);if(w.x===P.x&&w.y===P.y)hit=w}
 shake=Math.max(shake,reduceMotion?0:6);sfx(now[0].kind==='fire'?'fire':'magic');
 if(hit){const M=MON[hit.src],dmg=Math.max(1,roll(hit.dmg)-ri(Math.floor(defOf()/2),defOf()));msg(tr("b_warn_hit",L[hit.lbl],dmg),'blood');hurtPlayer(dmg,tr("t0268",M.n),'mon:'+hit.src);
  if(hit.kind==='fire'&&!gemN('a','fire'))P.st.burn=Math.max(P.st.burn||0,2);if(hit.kind==='void'&&gemN('a','void')<2){burnOil(4);P.st.dark=Math.max(P.st.dark||0,2);fov()}}}
const ring=(cx,cy,r0,r1)=>{const out=[];for(let y=cy-r1;y<=cy+r1;y++)for(let x=cx-r1;x<=cx+r1;x++){const c=cheb(x,y,cx,cy);if(c>=r0&&c<=r1)out.push([x,y])}return out};
// 守門者：壓低身子標出一條直線，下一回合沿線衝鋒
function wardenAct(m,d,see){m.c2=(m.c2===undefined?2:m.c2)-1;
 if(m.charge){const cells=m.charge;m.charge=null;G.warn=(G.warn||[]).filter(w=>!(w.src===m.k&&w.kind==='charge'));let hitP=false;
  for(const[x,y]of cells){if(x===P.x&&y===P.y){hitP=true;break}if(!passable(x,y)||occupied(x,y))break;m.x=x;m.y=y}
  fxBurst(m.x,m.y,'#e8c76a',10,3);shake=Math.max(shake,reduceMotion?0:8);sfx('boom');
  if(hitP){const dmg=Math.max(1,roll(m.atk+4)-ri(Math.floor(defOf()/2),defOf()));msg(tr("b_charge_hit",dmg),'blood');hurtPlayer(dmg,tr("t0268",MON[m.k].n),'mon:guard')}return}
 const dx=P.x-m.x,dy=P.y-m.y;
 if(m.c2<=0&&d>=2&&d<=5&&see&&(dx===0||dy===0||Math.abs(dx)===Math.abs(dy))){m.c2=5;const sx=Math.sign(dx),sy=Math.sign(dy),cells=[];
  for(let i=1;i<=d+1;i++){const x=m.x+sx*i,y=m.y+sy*i;if(tile(x,y)===T.WALL)break;cells.push([x,y])}
  m.charge=cells;telegraph(m,cells,0,'charge','b_lbl_charge');msg(L["b_charge"],'oil');return}
 if(d===1){monMelee(m);return}stepToward(m)}
function midAct(m,d,see){
 if(!inCandle(m)&&m.hp<m.mhp&&G.turn%2===0)m.hp++;
 m.cd=(m.cd===undefined?3:m.cd)-1;m.sc=(m.sc===undefined?6:m.sc)-1;m.c2=(m.c2===undefined?2:m.c2)-1;m.c3=(m.c3===undefined?4:m.c3)-1;
 if(!m.phase2&&m.hp<m.mhp*.5){m.phase2=true;m.spd=115;msg(L["b_phase_devour"],'violet');shake=reduceMotion?0:12;sfx('boom');fxBurst(m.x,m.y,'#7d8aff',30,4);return}
 if(m.c2<=0&&d<=5&&see&&!hasWarn(m)){m.c2=m.phase2?3:4;
  let cells=[[P.x,P.y]];if(m.phase2){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])for(let i=1;i<=3;i++)cells.push([P.x+dx*i,P.y+dy*i])}else cells.push([P.x+1,P.y],[P.x-1,P.y],[P.x,P.y+1],[P.x,P.y-1]);
  // 公平：身邊一定要留一格躲得開的地方（走廊裡斜角是牆，十字會把前後都封死）；沒有的話只罩你腳下那一格
  // 兩步之內走得到範圍外，才放完整的暗潮；走不到（例如一格寬的走廊裡第二階段的十字）就只罩你腳下
  const inC=(x,y)=>cells.some(c=>c[0]===x&&c[1]===y),free=(x,y)=>passable(x,y)&&!occupied(x,y);
  if(!DIRS.some(([dx,dy])=>{const x=P.x+dx,y=P.y+dy;if(!free(x,y))return false;if(!inC(x,y))return true;return DIRS.some(([ex,ey])=>free(x+ex,y+ey)&&!inC(x+ex,y+ey)&&!(x+ex===P.x&&y+ey===P.y))}))cells=[[P.x,P.y]];
  telegraph(m,cells,m.atk+(m.phase2?3:2),'void','b_lbl_tide',2);msg(L[m.phase2?"b_tide2":"b_tide"],'violet');if(!G.tideHint){G.tideHint=1;msg(L.b_tide_hint,'dim')}
  sfx('magic');return}
 const busy=hasWarn(m);   // 暗潮還沒落下時，不會再把你拖過去或吸油，免得連招躲不掉
 if(!busy&&m.c3<=0&&d>=3&&d<=6&&see){m.c3=7;let n=0;for(let i=0;i<2;i++){const nx=P.x-Math.sign(P.x-m.x),ny=P.y-Math.sign(P.y-m.y);if(!passable(nx,ny)||occupied(nx,ny))break;P.x=nx;P.y=ny;n++}
  if(n){if(gemN('a','void')<2)burnOil(5);fxBolt(m.x,m.y,P.x,P.y,'#7d8aff');msg(L["b_pull"],'violet');sfx('magic');fov();return}}
 if(!busy&&m.cd<=0&&d<=5&&see){m.cd=8;const vd=gemN('a','void');if(vd<2){P.st.dark=vd?2:4;burnOil(vd?3:6)}fov();fxBolt(P.x,P.y,m.x,m.y,'#7d8aff');msg(L["t0283"],'violet');sfx('magic');return}
 if(m.sc<=0&&G.mons.length<12){m.sc=10;let n=0;for(const[dx,dy]of shuffle([...DIRS])){if(n>=2)break;const x=m.x+dx,y=m.y+dy;if(!occupied(x,y)){const s=makeMon('shade',x,y,5);s.aware=true;s.summoned=true;G.mons.push(s);n++}}if(n){msg(L["t0284"],'violet');return}}
 if(d===1){monMelee(m);return}
 stepToward(m)}
function bossAct(m,d,see){
 m.cd=(m.cd||0)-1;m.sc=(m.sc===undefined?6:m.sc)-1;
 if(!m.enraged&&m.hp<m.mhp*.5){m.enraged=true;m.spd=125;msg(L["t0285"],'ember');shake=reduceMotion?0:12;sfx('boom');return}
 m.c2=(m.c2===undefined?2:m.c2)-1;m.c3=(m.c3===undefined?3:m.c3)-1;
 if(m.c3<=0&&d<=1&&!hasWarn(m)){m.c3=m.enraged?4:6;telegraph(m,ring(m.x,m.y,1,1),m.atk+5,'fire','b_lbl_nova',2);msg(L["b_nova"],'ember');sfx('fire');return}
 if(m.c2<=0&&d<=7&&see&&!hasWarn(m)){m.c2=m.enraged?3:5;const cells=[[P.x,P.y]],pool=shuffle(ring(P.x,P.y,1,2).filter(([x,y])=>passable(x,y)));cells.push(...pool.slice(0,m.enraged?6:4));
  telegraph(m,cells,m.atk+1,'fire','b_lbl_meteor',2);msg(L["b_meteor"],'ember');sfx('fire');return}
 if(m.sc<=0&&m.hp<m.mhp*.8&&G.mons.length<9){m.sc=8;let n=0;for(const[dx,dy]of shuffle([...DIRS])){if(n>=2)break;const x=m.x+dx,y=m.y+dy;if(!occupied(x,y)){const s=makeMon(pick(['skel','bomb','archer','wolf']),x,y,10);s.aware=true;s.summoned=true;G.mons.push(s);n++}}msg(L["t0286"],'violet');sfx('magic');return}
 if(m.cd<=0&&d>1&&d<=6&&see){m.cd=m.enraged?3:4;const cells=lineCells(m.x,m.y,P.x+Math.sign(P.x-m.x),P.y+Math.sign(P.y-m.y));msg(L["t0287"],'ember');sfx('fire');
  for(const[x,y]of cells){fxBurst(x,y,'#ff6a2a',5,2);ignite(x,y);if(x===P.x&&y===P.y){if(monStrike(m,m.atk-1,L["t0288"]))P.st.burn=3}const o=monAt(x,y);if(o&&o!==m)hurtMon(o,6,false)}return}
 if(d===1){monMelee(m);return}stepToward(m)}

/* ================= 火焰 ================= */
function ignite(x,y){if(tile(x,y)===T.GRASS&&!G.fires.some(f=>f.x===x&&f.y===y))G.fires.push({x,y,t:3})}
function updateFires(){if(!G.fires.length)return;const nf=[];
 for(const f of G.fires){if(P.x===f.x&&P.y===f.y){const fa=gemN('a','fire');if(fa>=3)healPlayer(2);else if(fa<2)hurtPlayer(fa?2:3,L["t0289"],'fire');if(!fa)P.st.burn=Math.max(P.st.burn||0,2)}
  const o=monAt(f.x,f.y);if(o){hurtMon(o,3,false);if(!o.st.burnP)o.st.burn=2}
  for(const[dx,dy]of DIRS){const x=f.x+dx,y=f.y+dy;if(tile(x,y)===T.GRASS&&chance(G.omen==='fire'?.55:.35)&&!G.fires.some(q=>q.x===x&&q.y===y)&&!nf.some(q=>q.x===x&&q.y===y))nf.push({x,y,t:3})}
  f.t--;if(f.t<=0)G.map[idx(f.x,f.y)]=T.FLOOR}
 G.fires=G.fires.filter(f=>f.t>0).concat(nf)}

/* ================= 玩家行動 ================= */
function burnOil(a){if(P.oil<=0)return;const r0=lightR(),before=P.oil;P.oil=Math.max(0,P.oil-a);
 for(const th of[30,10])if(before>th&&P.oil<=th)msg(th===30?L["t0290"]:L["t0291"],'oil');
 if(P.oil===0){msg(L["t0292"],'blood');sfx('out');const oil=P.inv.find(i=>i.cat==='oil');if(oil)useItem(P.inv.indexOf(oil),true)}
 if(lightR()!==r0)fov()}
// 燈油只依回合燃燒（endTurn 裡）；這裡只負責每 10 秒自動存檔一次
setInterval(()=>{if(!canAct()||document.hidden||auto)return;G.clock=(G.clock||0)+1;if(G.clock%10===0)save()},1000);
function endTurn(){
 if(G.over)return;G.turn++;const st=P.st;if(G.cd>0)G.cd--;if(P.rl>0)P.rl--;
 if(G.cls==='miko'&&G.turn%6===0&&P.hp<P.mhp)healPlayer(1);   // 燈花報喜：每 6 回合回 1 點生命
 if(st.poison>0){st.poison--;hurtPlayer(1,L["t0293"]);if(!st.poison)msg(L["t0294"],'jade')}
 if(st.burn>0){st.burn--;const gfa=gemN('a','fire');if(!gfa)hurtPlayer(2,L["t0289"],'fire');else if(gfa>=3)healPlayer(2)}
 const ends={dark:L["t0295"],stealth:L["t0296"],str:L["t0297"],haste:L["t0298"],confuse:L["t0299"],slow:L["t0300"],sight:L["t0301"]};
 for(const k in ends)if(st[k]>0&&!(P.fresh&&P.fresh[k])){st[k]--;if(!st[k])msg(ends[k],'dim')}
 P.fresh=null;
 if(G.over)return;
 if(P.oil>0){burnOil(.22*oilMul());G.bites=0;G.dark=0}
 // 燈熄了：每 6 回合被黑暗咬一口，越咬越深（1、1、2、2、3……）；補到油、燈重新亮起就重新算
 else{G.dark++;if(G.dark%6===0){G.bites=(G.bites||0)+1;const n=G.bites;msg(n<=1?L["t0302"]:n<=3?L.ui_dark_bite2:L.ui_dark_bite3,'blood');hurtPlayer(1+Math.floor((n-1)/2),L["t0303"],'dark')}}
 if(!st.poison&&G.turn%15===0)healPlayer(1);
 if(P.hood&&rel('veil')&&G.turn%4===0)healPlayer(1);
 const gal=gemN('a','life');if(gal&&G.turn%Math.max(4,Math.round(12/gal))===0)healPlayer(1);
 const rg=perk('regen');if(rg&&G.turn%[0,8,5,3][rg]===0)healPlayer(1);
 if(G.over)return;
 detonateWarns();if(G.over)return;
 computeDist();
